name: Bug report
description: Report a reproducible Future problem
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private conversations, or guest filesystem data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: dropdown
    id: boot
    attributes:
      label: Runtime state
      options:
        - First installation
        - Restored snapshot
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, conversations, filenames, and personal data.
      render: text
